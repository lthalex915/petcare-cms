version: '3.8'
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: petcare_cms
      POSTGRES_USER: petcare
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U petcare"]
      interval: 10s
      timeout: 5s
      retries: 5
    ports:
      - "5432:5432"

  backend:
    build: ./backend
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://petcare:${DB_PASSWORD}@postgres:5432/petcare_cms
      JWT_SECRET: ${JWT_SECRET}
      PORT: 4000
      APP_URL: http://localhost
      APP_TITLE: PetCare CMS
    ports:
      - "4000:4000"
    command: sh -c "npx prisma generate && npx prisma migrate deploy && npx prisma db seed && node dist/index.js"

  frontend:
    build: ./frontend
    depends_on:
      - backend
    ports:
      - "80:80"

volumes:
  postgres_data:
